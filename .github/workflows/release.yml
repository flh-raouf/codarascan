name: Build release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified artifacts to PyPI after environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install cibuildwheel==4.1.1
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
          CIBW_ENVIRONMENT: "CODARASCAN_REQUIRE_NATIVE=1"
          CIBW_TEST_COMMAND: "python {project}/tools/artifact_smoke.py"
      - run: python tools/inspect_artifacts.py wheelhouse/*
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist
      - run: python tools/inspect_artifacts.py dist/*.tar.gz
      - run: python tools/dependency_manifest.py dist/*.tar.gz --output evidence/dependency-manifest.json
      - run: python -m venv /tmp/codarascan-sdist-smoke
      - run: /tmp/codarascan-sdist-smoke/bin/python -m pip install dist/*.tar.gz
        env:
          CODARASCAN_REQUIRE_NATIVE: "1"
      - run: /tmp/codarascan-sdist-smoke/bin/python tools/artifact_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: release-evidence
          path: evidence/dependency-manifest.json
          if-no-files-found: error

  release-evidence:
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v7
        with:
          pattern: "wheels-*"
          path: release-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: release-artifacts
      - run: >-
          python tools/release_manifest.py release-artifacts/*
          --expected-artifacts 21
          --output evidence/release-manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-checksums
          path: evidence/release-manifest.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [wheels, sdist, release-evidence]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
